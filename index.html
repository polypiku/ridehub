<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideHub — ระบบจัดการ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',sans-serif;min-height:100vh;background:#f6fdf8;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:580px;text-align:center;background:#fff;border-radius:24px;border:1.5px solid #e5e7eb;padding:52px 28px 44px}
.logo-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.logo-icon{width:52px;height:52px;background:#0e5530;border-radius:16px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:26px;height:26px;fill:#4ade80}
.logo-text{font-size:32px;font-weight:800;color:#0e5530;letter-spacing:-0.5px}
.logo-text span{color:#2E8B3F}
.tagline{font-size:13px;color:#6b7280;font-weight:400}
.sep{display:flex;align-items:center;gap:12px;margin:20px 0 32px}
.sep-line{flex:1;height:1px;background:#e5e7eb}
.sep-dot{width:6px;height:6px;border-radius:50%;background:#2E8B3F}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:36px}
.card{background:#fff;border:1.5px solid #e5e7eb;border-radius:20px;padding:28px 22px 24px;text-decoration:none;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;transition:border-color .18s,transform .18s,box-shadow .18s}
.card:hover{border-color:#0e5530;transform:translateY(-4px);box-shadow:0 12px 32px rgba(14,85,48,.12)}
.card-badge{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#0e5530;padding:3px 10px;border-radius:20px;line-height:1.6}
.card-icon{width:46px;height:46px;border-radius:13px;background:#f0faf4;display:flex;align-items:center;justify-content:center}
.card-icon svg{width:22px;height:22px}
.card-title{font-size:18px;font-weight:800;color:#0e5530;line-height:1.2;margin-top:-2px}
.card-desc{font-size:12px;color:#6b7280;line-height:1.55}
.footer{font-size:11px;color:#d1d5db}
@media(max-width:480px){.cards{grid-template-columns:1fr}.logo-text{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <div class="logo-text">Ride<span>Hub</span></div>
  </div>
  <p class="tagline">ระบบจัดการไรเดอร์และ Admin แบบครบวงจร</p>
  <div class="sep"><div class="sep-line"></div><div class="sep-dot"></div><div class="sep-line"></div></div>

  <div class="cards">
    <a href="ridehub_admin.html" class="card">
      <span class="card-badge">Admin</span>
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="4" stroke="#0e5530" stroke-width="1.8"/>
          <path d="M7 8h10M7 12h6M7 16h8" stroke="#0e5530" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="card-title">Admin Panel</div>
        <div class="card-desc">จัดการไรเดอร์ คำสั่ง ซับสคริปชัน และรายงาน</div>
      </div>
    </a>

    <a href="ridehub_ride.html" class="card">
      <span class="card-badge">Rider</span>
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="7.5" cy="17.5" r="2.5" stroke="#0e5530" stroke-width="1.8"/>
          <circle cx="17.5" cy="17.5" r="2.5" stroke="#0e5530" stroke-width="1.8"/>
          <path d="M5 17.5H3V10l3-4h8l2 4h2l2 2v5.5h-2" stroke="#0e5530" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 12h5.5" stroke="#0e5530" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="card-title">Rider App</div>
        <div class="card-desc">รับงาน ติดตามสถานะ และจัดการรายได้</div>
      </div>
    </a>
  </div>

  <p class="footer">RideHub © 2026 ระบบจัดการไรเดอร์</p>
</div>
</body>
</html>
